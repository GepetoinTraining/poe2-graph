style_notes: |
  Rakin is the dominant PT-BR PoE 2 streamer by viewership — ~368k viewer hours in
  the 30 days before 0.5 launch, 1.68M Twitch followers. His content is built around
  finding builds capable of topping the ladder; a December 2024 video series documented
  the exact Invoker Ailment Tri-Element build that brought him to world rank #1.
  He publishes shorter YouTube VODs on specific build versions (Storm Wave Invoker,
  CI Stormwave) alongside Twitch marathons. His teaching angle is implicit — he
  explains decisions as he executes them, so the value is in watching the logic, not
  a structured guide format. Strong for players ready to push past median endgame.
  Mobalytics hosts a "Build Rakin Invoker" guide credited to him.

