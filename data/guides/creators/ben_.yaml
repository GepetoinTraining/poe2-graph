style_notes: |
  Multi-league HC streak streamer. Quietly analytical voice — never hypes,
  rarely tilts, narrates decisions as he makes them. Doesn't run build guides
  in the tutorial sense; the value is the posture and reasoning he models
  in real time. The canonical "watch him for an hour" creator for any player
  who's panicking after a big drop, considering HC for the first time, or
  recently lost a character and needs to see patient analytical play
  demonstrated rather than explained.

  His edge is shape, not content. Don't recommend him as a build resource;
  recommend him when the player needs to see how the discipline of waiting
  + thinking actually looks.

