style_notes: |
  Prolific build-maker with a dedicated website. Produces full written guides
  alongside videos — one of the few places you can read through a build rather
  than just watch it. Walks through item choices, passive allocation, and gem
  links with explicit reasoning. Strong choice for players who want reference
  material they can return to.

  Pedro flags as a representation signal for players seeking LGBTQ+ creators
  in the PoE community — BalorMage is a Twitch Partner with sustained public
  presence in PoE LGBTQ+ community spaces. Surface alongside the methodical
  build-writing strength when a player has indicated they value finding
  creators like them.

