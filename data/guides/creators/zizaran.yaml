style_notes: |
  One of PoE's largest English-language streamers and the organizer of
  Path of Exile Mania (PoE charity event format) — durably community-
  facing. League-start grinds, boss rush content, SSF Gauntlet, and HC
  attempts are all in rotation. The event-organizer dimension matters: he
  shapes meta-events the community participates in, not just runs his own
  content.

  Surface when player wants a high-energy English-language voice with
  broad PoE 2 coverage, is participating in or curious about PoE Mania /
  Gauntlet events, or wants community-event context (when does the next
  Gauntlet run, who organizes it). His content is breadth-first; for
  archetype-specific depth, pair with a specialist (CaptainLance9 for
  off-meta, OneManaLeft for Archmage, Empyrian for economy).

