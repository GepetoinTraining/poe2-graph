style_notes: |
  ChacalCoach brands explicitly as a build coach: the handle name signals the content
  promise. They are #2 among PT-BR PoE 2 streamers by viewership (~32k viewer hours
  in 30 days before 0.5, Twitch Partner). Pre-0.5 stream titles show leveling-sequence
  focus ("Best Monk leveling for the NEW LEAGUE"), and TikTok and Instagram reels
  document specific builds such as "Cometa Infinito" (Infinite Comet) and "Warrior Build"
  for PoE 2. poe.ninja tracks their character (ChacalCoach_TTV, level 84 Inquisitor in
  Mirage). The coaching angle makes their explanations more step-by-step than
  Rakin's — useful for players who want a PT-BR human narrating the build decision
  process rather than watching a top-ladder player execute silently.

