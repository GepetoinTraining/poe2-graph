style_notes: |
  ProfessorLih runs Escola do Exilado ("School of the Exile"), self-described as
  the largest PT-BR beginner-focused PoE channel. He streams Tuesday–Saturday at
  20h BRT on Twitch and uploads edited guides to YouTube under the @EscolaDoExilado
  handle. His style is classroom-first: videos are named like lesson plans ("11 Things
  Beginners NEED to Know", "Everything About Atlas and Voidstones", "Complete Path of
  Building Guide for Beginners"). He covers both PoE 1 and PoE 2, with confirmed 0.5
  Return of the Ancients coverage published May 2026. Well suited for players who need
  a structured on-ramp to game mechanics, atlas pathing, and reading the economy before
  their first serious league. Live streams mix gameplay with open Q&A.

