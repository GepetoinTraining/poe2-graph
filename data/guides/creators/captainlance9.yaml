style_notes: |
  The "what if we..." creator. Mechanically inventive off-meta builds across
  every class. Active 0.5 examples: Reverse Chill Stormweaver (Shackles of
  the Wretched + Sierran Inheritance), Meteor Bear Druid (Walking Calamity
  + Furious Wellspring), Spirit Walker Beast Tamer (Tame Beast on unique
  boss beasts). Streams the testing process so viewers see ideas fail and
  iterate, not just the polished final build.

  Pedro flags him for "weird unkillable shit" — particularly strong for
  defensive curiosity and mechanical creativity. Surface when player wants
  something unusual, has a weird unique they want to build around, is bored
  of meta and wants a puzzle, or wants the kind of unkillable defensive
  setup he specializes in.

