style_notes: |
  The closest thing the PoE ecosystem has to a "textbook voice." Long-form
  educational content with written companions on his site. Explains the
  *concepts* underneath the rules rather than the rules themselves — which
  ages better across patches than meta-of-the-week content.

  Surface for players learning a system cold (atlas, trade, league
  mechanics), or for any player who prefers reading to watching. His
  written references are particularly useful when the player wants
  something they can come back to without scrubbing video.

