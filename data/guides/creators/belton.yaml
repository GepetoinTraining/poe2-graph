style_notes: |
  Canadian streamer. Public reputation in the PoE community: "The Most
  Prolific Mirror Crafter and Economy Focused Creator in Path of Exile's
  History." Streaming since 2021-07-21. PoE 2 active through 0.5 patch
  cycle. All-time peak 4,274 concurrent viewers (2024-01-20).

  This is the canonical mirror-crafter voice. Where Empyrian teaches
  endgame *farming* economy, Belton teaches the *very-top-end crafting*
  economy — the mechanics, the math, and the patience of producing items
  at the divine-to-mirror tier. Surface when: player asks about high-end
  crafting, has accumulated enough wealth to consider a mirror-tier
  project, wants to understand how mirror items get made (and why they
  cost what they do), or needs to learn the discipline of expensive
  multi-stage crafts where mistakes are punishing.

  His content is reference-quality for the niche. For players still in
  the campaign or early mapping, Belton is aspirational — calibrate
  against time budget + peak wealth tier before recommending.

