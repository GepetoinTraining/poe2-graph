style_notes: |
  PoE community fixture since 2013-ish. Streaming style is quieter and more
  mellow than the high-energy norm — calm narration, deadpan humor,
  occasional esoteric riffs. Competition focus: HCSSF (Hardcore Solo
  Self-Found) races, where she typically places top 10. Steady audience
  growth into PoE 2 — ~200k Twitch followers, ~80k YouTube subs.

  Surface for: HC-curious players who don't vibe with the loud HC voices
  (Quin69 / Zizaran style); SSF-curious players who want to see the mode
  played seriously; players who want a calmer stream to learn from without
  the hype layer. Also a representation signal for players seeking women
  creators in PoE — a community where the visible voices skew heavily male.

