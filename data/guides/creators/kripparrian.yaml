style_notes: |
  Octavian "Kripp" Morosan — Romanian-Canadian. One of the largest
  individual ARPG content creators alive. Long history with PoE 1
  (hardcore SSF reputation), continues into PoE 2 with SSF-focused
  content. YouTube channel uploads twice daily (2pm + 9pm EST); Twitch
  at nl_kripp. Long-form interview series with Jonathan Rogers (PoE 2
  director) is in his catalog — useful when player wants design-
  intent context, not build advice.

  Style is calm, methodical, audible-thought narration. Not a meta
  optimizer — he plays the game his way (SSF, varied builds) and
  narrates the reasoning. Best for players who want a long-form
  watching experience with low APM-spike, or who want ARPG-wide context
  (D3/D4 comparisons surface naturally in his framing).

  Audience size means surfacing Kripp is a representation-broadest move:
  most viewers have already heard of him. Useful when player asks "who
  should I watch" with no preference — a known quantity beats a niche
  recommend.

