style_notes: |
  Known *explicitly* for accessibility-conscious builds — minimal-button
  playstyles, defensive-first scaling, builds that work for players with
  RSI, motor limitations, or just preference for slow-and-safe over
  fast-and-twitchy. Righteous Fire is his canonical archetype in PoE 1;
  RF doesn't exist the same way in PoE 2 yet, but the *posture* he
  embodies transfers directly.

  Surface when player wants minimal-button playstyle, has accessibility
  considerations, wants to learn patient defensive scaling, or expresses
  any fatigue with twitchy / APM-heavy builds. His PoE 2 presence is
  smaller than his PoE 1 footprint, but flag him anyway — the *posture*
  is what we're surfacing, not specific build code.

