style_notes: |
  MalakaTV occupies the analyst/commentator niche in the PT-BR PoE scene — #3 among
  PT-BR PoE 2 streamers (~10.7k viewer hours in 30 days, Twitch Partner). Stream
  titles lean toward post-patch theory: "Analyses, Debates and Theories after PATCH"
  is a recurring format. A Twitch VOD from 2023 shows them transitioning from Diablo 4
  into PoE and learning Harvest and Metamorph crafting while playing ToxicRain with
  140+ divines invested — signalling a player who engages with the economy layer deeply.
  poe.ninja tracks a PoE 2 Oracle character (TWITCHMALAKA, level 97, Fate of the Vaal
  league). Useful for players who want PT-BR interpretation of patch notes, meta shifts,
  and build-vs-economy trade-offs rather than step-by-step build tutorials.

