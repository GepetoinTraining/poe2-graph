style_notes: |
  Pure damage theorycraft — "max DPS this skill" content is his archetype.
  Most useful as a reference for what the mechanical ceiling of a given
  skill looks like, not as a build-to-follow (his configurations are
  often unrealistic for mid-game players).

  Catalog entry is provisional / reference-only. Surface when player has
  asked specifically about the upper bound of a skill's damage potential
  or wants to understand which skill mechanics scale infinitely vs. cap
  out. Pair with a more grounded creator (Ghazzy, Empyrian, Subtractem)
  for actually achievable versions.

