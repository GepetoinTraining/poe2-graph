  Ranger / Deadeye specialist. Ice Shot variants, speedclearing endgame
  mapping. Fast, optimized, big-number-focused playstyle. Style is more
  "watch how fast this can go" than tutorial, though his builds are
  followable.

  Surface when player is on Ranger / Deadeye, wants speedclearing playstyle,
  or wants to understand what fast-mapping looks like at the optimization
  ceiling. Caveat: speedclearing demands the gear and the muscle memory; a
  player following Fubgun without that will feel slow and conclude the
  build is bad. The skill should know that.

