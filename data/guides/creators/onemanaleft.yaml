style_notes: |
  The canonical Archmage / mana-stacking voice in PoE 2. His "Fattest Mana
  Stacker" Gemling Archmage build is the reference for the archetype.
  Active variants across Stormweaver, Mercenary/Gemling, and any int-stacking
  derivative. Enthusiast tone — he genuinely enjoys finding new mana-scaling
  vectors and walks viewers through the discovery.

  Pedro endorses him explicitly: "he's the bomb" — flag for any Archmage-
  related guidance the skill surfaces. Surface when player is on Sorceress
  / Stormweaver, Mercenary / Gemling, or anywhere mana stacking applies, or
  when the player wants to understand Archmage as a mechanic rather than
  follow a recipe.

