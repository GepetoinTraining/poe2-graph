schema_version: 1
id: upgrade_pacing_v1
topic: "Upgrade pacing — sequence over magnitude, ratio over impulse"
summary: |
  The trap most mid-game players fall into is the wow-upgrade: a single item that looks
  transformative, consumes most of their liquid currency, and leaves them unable to
  sustain mapping or pursue the next step. This guide teaches upgrade-pacing discipline —
  value upgrades by capability-per-cost, never burn the engine for a single purchase,
  recognise that 50 more maps at the current tier is often the right next move even when
  an upgrade is "right there." The 80/100 rule: never spend 80%+ of liquid unless you're
  getting 80%+ more capability. Resists the impulse-buy-and-strand pattern that quietly
  kills a league for many players around weeks 2-3.
game: poe2
version_minimum: "0.5.0"
last_updated: 2026-05-26
difficulty: intermediate

transmits:
  - marginal_capability_thinking
  - investing_vs_gambling
  - downside_discipline

case_studies:
