creators:
  - handle: empyriangaming
    role: economic_primary
    note: |
      Currency-flow framing of upgrades — the "what does this enable in
      terms of future farming velocity" lens is core to his retrospectives.
      Pair when player needs to learn upgrade-as-investment thinking
      rather than upgrade-as-purchase.
  - handle: ben_
    role: HC_discipline_carryover
    note: |
      HC context forces 80/100 reasoning naturally; he articulates which
      upgrades clear the rule and which don't. Surface when player needs
      to see the discipline modeled in real time rather than explained.
  - handle: steelmage
    role: mapper_pacing
    note: |
      Mapping efficiency is itself a capability-per-cost optimization
      problem; he frames atlas-tree allocation in the same vein. Useful
      when player is thinking about whether to "level the mapper" vs
      "buy the chase item."
  - handle: subtractem
    role: melee_specialty
    note: |
      Melee builds are leverage-point-heavy; he names which slot is
      enabling-next-tier and which is luxury. Surface for Warrior /
      Titan / Warbringer players asking pacing questions.

